<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINEdb — Sub-subfamily Detail</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font:12px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#222;background:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
a{color:#1a5dab;text-decoration:none}
a:hover{text-decoration:underline}
#topbar{display:flex;align-items:center;background:#1a4d8c;color:#fff;padding:0 8px;height:28px;flex-shrink:0;font-size:12px;gap:12px}
#topbar .title{font-weight:700;font-size:13px;letter-spacing:.5px}
#topbar .nav-link{color:rgba(255,255,255,.85);font-size:11px;padding:2px 8px;border:1px solid rgba(255,255,255,.3);border-radius:3px}
#topbar .nav-link:hover{background:rgba(255,255,255,.15);text-decoration:none}
#topbar .stats{font-size:11px;opacity:.85;margin-left:auto}
.page-header{padding:8px 16px;background:#f0f4f8;border-bottom:1px solid #d0d4d8}
.page-header h2{font-size:14px;color:#1a4d8c;margin-bottom:2px}
.page-header p{font-size:11px;color:#555;max-width:1100px}
.controls{padding:4px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-bottom:1px solid #e0e0e0;background:#fafbfc;min-height:28px}
.controls label{font-weight:600;font-size:11px}
.controls select,.controls input[type=number]{font-size:11px;padding:1px 4px;border:1px solid #aaa}
.controls input[type=checkbox]{vertical-align:middle}
.filter-btn{font-size:10px;padding:1px 6px;cursor:pointer;border:1px solid #999;background:#f0f0f0;border-radius:3px;font-weight:600}
.filter-btn:hover{background:#ddd}
.sep{border-left:1px solid #ccc;height:18px;margin:0 2px}
.table-wrap{overflow:auto;flex:1;min-height:0;padding:0}
table{border-collapse:separate;border-spacing:0;font-size:10px}
table th,table td{border:1px solid #d0d0d0;padding:2px 3px;white-space:nowrap}
table thead th{position:sticky;top:0;z-index:4;background:#1a4d8c;color:#fff;font-size:10px;font-weight:600;cursor:pointer;user-select:none}
table thead th:hover{background:#15407a}
table .sticky-sp{position:sticky;left:0;z-index:2;background:#fff;border-right:2px solid #999;width:170px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:normal;line-height:1.15}
table thead .sticky-sp{z-index:5;background:#1a4d8c}
table .sticky-tot{position:sticky;left:172px;z-index:2;background:#fff;border-right:2px solid #999;min-width:55px;text-align:right;font-weight:700}
table thead .sticky-tot{z-index:5;background:#1a4d8c}
table .sf-vert{writing-mode:vertical-lr;text-orientation:mixed;font-size:9px;max-width:26px;min-width:26px;padding:2px 1px}
table .sf-vert:hover{background:#15407a}
.c-high{background:#1a6b3c;color:#fff}
.c-med{background:#5ab87a;color:#000}
.c-low{background:#c8e6c9;color:#333}
.c-zero{background:#fff;color:#ddd}
.c-trace{background:#ffecb3;color:#8d6e63}
.c-na{background:#f0f0f0;color:#bbb;font-style:italic;text-align:center}
table tfoot td{font-weight:700;background:#e8ecf0;border-top:2px solid #999}
table tfoot .sticky-sp,table tfoot .sticky-tot{background:#e8ecf0}
tr:hover td{background-color:rgba(232,240,254,.4)}
tr:hover .sticky-sp,tr:hover .sticky-tot{background:#e8f0fe}
td[title]{cursor:help}
td.cell-checked{position:relative}
td.cell-checked::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent #1976d2 transparent transparent;pointer-events:none}
td.cell-working{position:relative}
td.cell-working::after{content:'';position:absolute;top:0;right:0;border-style:solid;border-width:0 8px 8px 0;border-color:transparent #e53935 transparent transparent;pointer-events:none}
td.cell-edited{position:relative}
td.cell-edited::before{content:'';position:absolute;top:0;left:0;border-style:solid;border-width:8px 8px 0 0;border-color:#ff9800 transparent transparent transparent;pointer-events:none}
.status-legend{font-size:10px;display:flex;gap:8px;align-items:center}
.status-legend .swatch{display:inline-block;width:0;height:0;border-style:solid;border-width:0 8px 8px 0;vertical-align:middle;margin-right:2px}
.status-legend .sw-checked{border-color:transparent #1976d2 transparent transparent}
.status-legend .sw-working{border-color:transparent #e53935 transparent transparent}
.status-legend .sw-edited{border-color:#ff9800 transparent transparent transparent;border-width:8px 8px 0 0}
.export-btn{font-size:10px;padding:1px 8px;cursor:pointer;border:1px solid #1a4d8c;background:#e3f2fd;border-radius:3px;color:#1a4d8c;font-weight:600}
.export-btn:hover{background:#bbdefb}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.modal{background:#fff;border:1px solid #666;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:700px;width:95%;max-height:85vh;overflow:auto;font-size:11px}
.modal-title{background:#1a4d8c;color:#fff;padding:4px 8px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.modal-title button{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:0 4px}
.modal-body{padding:8px}
.modal-body label{display:block;font-weight:600;margin:4px 0 1px;font-size:10px;color:#555;text-transform:uppercase}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;margin-bottom:2px;font:11px/1.3 inherit;border:1px solid #aaa;padding:1px 3px;background:#fffef5}
.modal-body textarea{height:50px;resize:vertical}
.modal-footer{padding:4px 8px 8px;text-align:right;display:flex;gap:6px;justify-content:flex-end}
.modal-footer button{font:11px/1.3 inherit;padding:2px 8px;cursor:pointer;border:1px solid #888;background:#f0f0f0;border-radius:2px}
.modal-footer button:hover{background:#ddd}
.modal-footer button.primary{background:#1a4d8c;color:#fff;border-color:#1a4d8c}
.modal-footer button.primary:hover{background:#15407a}
</style>
</head>
<body>

<div id="topbar">
  <span class="title">SINEdb — Sub-subfamily Detail</span>
  <a class="nav-link" href="unified.html">← Unified Table</a>
  <span class="stats" id="topStats"></span>
</div>

<div class="page-header">
  <h2 id="pageTitle">Loading…</h2>
  <p id="pageDesc"></p>
</div>

<div class="controls" id="controlRow1">
  <label><input type="checkbox" id="hideEmpty" onchange="render()"> Hide empty columns</label>
  <label><input type="checkbox" id="hideEmptyRows" onchange="render()"> Hide empty rows</label>
  <div class="sep"></div>
  <span class="status-legend"><span class="swatch sw-checked"></span>Checked <span class="swatch sw-working"></span>Working <span class="swatch sw-edited"></span>Edited</span>
  <button class="export-btn" onclick="exportJSON()" title="Download sub-subfamily JSON with edits">Export JSON</button>
  <button class="export-btn" onclick="clearLocalEdits()" title="Discard all browser-stored edits and reload" style="background:#fee;color:#c33;border-color:#c99">Clear local edits</button>
  <span id="countInfo" style="margin-left:auto;color:#666;font-size:11px"></span>
</div>

<div class="table-wrap" id="tableWrap"></div>

<script>
let DATA = null;
let sortCol = null, sortDir = 1;

let COLUMNS = [];
let ENTRY_MAP = {};
let TAXON_ENTRIES = {};

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmt(n){return (n!=null&&n!=='')?Number(n).toLocaleString():'—';}

const EDIT_PASS_HASH = '75f7432572904fd9ac7f3f3f651d3c956f35448d8432be706c09c075a77bd98b';
let _editAuth = sessionStorage.getItem('sedb_edit') === '1';

function _hashStr(str){
  return crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
    .then(buf => Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''));
}

function requireEditAuth(cb){
  if(_editAuth){ cb(); return; }
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center';
  ov.innerHTML = '<div style="background:#fff;border-radius:6px;padding:24px;min-width:280px;max-width:320px;box-shadow:0 4px 20px rgba(0,0,0,.35)">'
    +'<div style="font-weight:700;font-size:14px;margin-bottom:10px;color:#1a4d8c">🔒 Curation password required</div>'
    +'<input id="_authInput" type="password" autocomplete="current-password" style="width:100%;padding:6px 8px;font-size:13px;border:1px solid #aaa;border-radius:4px" placeholder="Password">'
    +'<div style="color:#e53935;font-size:11px;margin-top:4px;min-height:14px" id="_authErr"></div>'
    +'<div style="display:flex;gap:8px;margin-top:14px;justify-content:flex-end">'
    +'<button onclick="this.closest(\'[data-auth]\').remove()" style="padding:4px 14px;cursor:pointer">Cancel</button>'
    +'<button id="_authOK" style="padding:4px 14px;background:#1a4d8c;color:#fff;border:none;border-radius:4px;cursor:pointer">Unlock</button>'
    +'</div></div>';
  ov.setAttribute('data-auth','1');
  document.body.appendChild(ov);
  const inp = ov.querySelector('#_authInput');
  const err = ov.querySelector('#_authErr');
  const check = ()=>{
    const val = inp.value;
    if(!val){ err.textContent='Enter a password.'; return; }
    _hashStr(val).then(h=>{
      if(h === EDIT_PASS_HASH){
        _editAuth = true;
        sessionStorage.setItem('sedb_edit','1');
        ov.remove();
        cb();
      } else {
        err.textContent = 'Incorrect password.';
        inp.value = ''; inp.focus();
      }
    });
  };
  ov.querySelector('#_authOK').addEventListener('click', check);
  inp.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
  let _mdt2=null; ov.addEventListener('mousedown', e=>{_mdt2=e.target;});
  ov.addEventListener('click', e=>{ if(e.target===ov&&_mdt2===ov) ov.remove(); });
  setTimeout(()=>inp.focus(), 50);
}

function _lsKey(){ return 'sinekb_subsf_' + (DATA ? DATA.parent : 'unknown'); }

function _saveEditsToLocalStorage(){
  if(!DATA) return;
  const edits = {};
  DATA.entries.forEach(e=>{
    const obj = {};
    let hasAny = false;
    if(e._edits && Object.keys(e._edits).length > 0){ obj._edits = e._edits; hasAny = true; }
    if(e.cell_status){ obj.cell_status = e.cell_status; hasAny = true; }
    if(hasAny) edits[e.id] = obj;
  });
  try { localStorage.setItem(_lsKey(), JSON.stringify(edits)); }
  catch(ex){ console.warn('Failed to save edits:', ex); }
}

function _loadEditsFromLocalStorage(){
  if(!DATA) return;
  let edits;
  try {
    const raw = localStorage.getItem(_lsKey());
    if(!raw) return;
    edits = JSON.parse(raw);
  } catch(ex){ return; }
  let count = 0;
  DATA.entries.forEach(e=>{
    const saved = edits[e.id];
    if(!saved) return;
    if(saved._edits){
      e._edits = saved._edits;
      if(saved._edits.copy_count != null){ e.copy_count = saved._edits.copy_count; count++; }
      if(saved._edits.notes != null) e.notes = saved._edits.notes;
      if(saved._edits.companion != null) e.companion = saved._edits.companion;
      if(saved._edits.consensus) e.seq = saved._edits.consensus;
    }
    if(saved.cell_status) e.cell_status = saved.cell_status;
  });
  if(count > 0) console.log('[SINE-KB] Restored ' + count + ' sub-subfamily edits from localStorage');
}

function clearLocalEdits(){
  localStorage.removeItem(_lsKey());
  location.reload();
}

async function init(){
  const params = new URLSearchParams(location.search);
  const sf = params.get('sf') || 'sq1_boa';
  try{
    const r = await fetch('sub_subfamilies/' + encodeURIComponent(sf) + '.json');
    if(!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
  }catch(e){
    document.getElementById('tableWrap').innerHTML='<p style="padding:20px;color:red">Error loading data: '+e.message+'</p>';
    return;
  }
  _loadEditsFromLocalStorage();
  COLUMNS = DATA.entries.map(e => e.id);
  ENTRY_MAP = {};
  TAXON_ENTRIES = {};
  DATA.entries.forEach(e=>{
    ENTRY_MAP[e.id] = e;
    if(!TAXON_ENTRIES[e.taxon]) TAXON_ENTRIES[e.taxon] = {};
    TAXON_ENTRIES[e.taxon][e.id] = e;
  });
  document.getElementById('pageTitle').textContent = DATA.parent + ' — Sub-subfamily Detail';
  document.getElementById('pageDesc').innerHTML = DATA.taxa_order.length + ' species, ' + DATA.entries.length + ' consensus sequences. Click a cell to view/edit. Right-click to cycle status.';
  document.getElementById('topStats').textContent = DATA.entries.length + ' sequences × ' + DATA.taxa_order.length + ' taxa';
  render();
}

function render(){
  const hideEmpty = document.getElementById('hideEmpty').checked;
  const hideEmptyRows = document.getElementById('hideEmptyRows').checked;
  let visCols = COLUMNS.slice();
  if(hideEmpty) visCols = visCols.filter(id => ENTRY_MAP[id] && ENTRY_MAP[id].copy_count > 0);
  let visTaxa = DATA.taxa_order.slice();
  if(hideEmptyRows) visTaxa = visTaxa.filter(t => TAXON_ENTRIES[t] && Object.keys(TAXON_ENTRIES[t]).length > 0);
  if(sortCol === 'species'){
    visTaxa.sort((a,b) => sortDir * a.localeCompare(b));
  } else if(sortCol === 'total'){
    visTaxa.sort((a,b) => {
      const ta = TAXON_ENTRIES[a] ? Object.values(TAXON_ENTRIES[a]).reduce((s,e)=>s+e.copy_count,0) : 0;
      const tb = TAXON_ENTRIES[b] ? Object.values(TAXON_ENTRIES[b]).reduce((s,e)=>s+e.copy_count,0) : 0;
      return sortDir * (ta - tb);
    });
  } else if(sortCol){
    visTaxa.sort((a,b) => {
      const ea = TAXON_ENTRIES[a] && TAXON_ENTRIES[a][sortCol];
      const eb = TAXON_ENTRIES[b] && TAXON_ENTRIES[b][sortCol];
      return sortDir * ((ea?ea.copy_count:0) - (eb?eb.copy_count:0));
    });
  }
  const colTotals = {};
  visCols.forEach(id => { colTotals[id] = ENTRY_MAP[id].copy_count || 0; });
  let grandTotal = 0;
  visTaxa.forEach(t => {
    const te = TAXON_ENTRIES[t];
    if(te) Object.values(te).forEach(e => { if(visCols.includes(e.id)) grandTotal += e.copy_count; });
  });
  let h = '<table id="sumTable"><thead><tr>';
  h += '<th class="sticky-sp" onclick="doSort(\'species\')">Species ⇕</th>';
  h += '<th class="sticky-tot" onclick="doSort(\'total\')">Tot ⇕</th>';
  visCols.forEach(id => {
    const e = ENTRY_MAP[id];
    h += '<th class="sf-vert" onclick="doSort(\''+esc(id)+'\')" title="'+esc(id)+' ('+esc(e.taxon.replace(/_/g,' '))+', '+e.copy_count+' copies)">'+esc(id)+'</th>';
  });
  h += '</tr></thead><tbody>';
  visTaxa.forEach(taxon => {
    const te = TAXON_ENTRIES[taxon] || {};
    const rowTotal = Object.values(te).reduce((s,e) => s + (visCols.includes(e.id) ? e.copy_count : 0), 0);
    h += '<tr data-taxon="'+esc(taxon)+'">';
    h += '<td class="sticky-sp"><i>'+esc(taxon.replace(/_/g,' '))+'</i></td>';
    h += '<td class="sticky-tot">'+fmt(rowTotal)+'</td>';
    visCols.forEach(id => {
      const entry = te[id];
      if(!entry){
        h += '<td class="c-na">—</td>';
        return;
      }
      const v = entry.copy_count;
      let cls;
      if(v > 10000) cls = 'c-high';
      else if(v > 1000) cls = 'c-med';
      else if(v > 10) cls = 'c-low';
      else if(v > 0) cls = 'c-trace';
      else cls = 'c-zero';
      const cStatus = entry.cell_status || '';
      const csCls = cStatus==='checked'?' cell-checked' : cStatus==='working'?' cell-working' : '';
      const editedCls = (entry._edits && Object.keys(entry._edits).length > 0) ? ' cell-edited' : '';
      const tip = id + ' in ' + taxon.replace(/_/g,' ') + ': ' + fmt(v) + ' copies';
      h += '<td class="'+cls+csCls+editedCls+'" title="'+esc(tip)+'" onclick="showCellInfo(\''+esc(id)+'\')" oncontextmenu="cycleStatus(event,\''+esc(id)+'\')">'+fmt(v)+'</td>';
    });
    h += '</tr>';
  });
  h += '</tbody><tfoot>';
  h += '<tr><td class="sticky-sp"><strong>Total</strong></td><td class="sticky-tot">'+fmt(grandTotal)+'</td>';
  visCols.forEach(id => { h += '<td style="text-align:right;font-weight:700">'+fmt(colTotals[id])+'</td>'; });
  h += '</tr></tfoot></table>';
  document.getElementById('tableWrap').innerHTML = h;
  document.getElementById('countInfo').textContent = visTaxa.length + ' taxa × ' + visCols.length + ' sequences';
}

function doSort(col){
  if(sortCol===col) sortDir*=-1;
  else{sortCol=col;sortDir=-1;}
  if(col==='species') sortDir=sortCol===col?sortDir:1;
  render();
}

function cycleStatus(event, entryId){
  event.preventDefault();
  const entry = ENTRY_MAP[entryId];
  if(!entry) return;
  requireEditAuth(()=>{
    const cur = entry.cell_status || '';
    if(cur === '') entry.cell_status = 'checked';
    else if(cur === 'checked') entry.cell_status = 'working';
    else delete entry.cell_status;
    _saveEditsToLocalStorage();
    render();
  });
}

function showModal(title, bodyHtml, onSave){
  const old = document.getElementById('_infoModal'); if(old) old.remove();
  const ov = document.createElement('div'); ov.className='modal-overlay'; ov.id='_infoModal';
  ov.innerHTML = '<div class="modal"><div class="modal-title"><span>'+title+'</span><button onclick="this.closest(\'.modal-overlay\').remove()">&times;</button></div><div class="modal-body">'+bodyHtml+'</div><div class="modal-footer"><button onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>'+(onSave?'<button class="primary" id="modalSaveBtn">Save</button>':'')+'</div></div>';
  document.body.appendChild(ov);
  if(onSave) ov.querySelector('#modalSaveBtn').addEventListener('click', function(){ if(!onSave || onSave(ov)!==false) ov.remove(); });
  let _mdt=null; ov.addEventListener('mousedown', function(e){_mdt=e.target;});
  ov.addEventListener('click', function(e){if(e.target===ov&&_mdt===ov) ov.remove();});
}

function showCellInfo(entryId){
  const entry = ENTRY_MAP[entryId];
  if(!entry) return;
  requireEditAuth(()=> _showCellInfoBody(entryId));
}

function _showCellInfoBody(entryId){
  const entry = ENTRY_MAP[entryId];
  if(!entry) return;
  const edits = entry._edits || {};
  const v = edits.copy_count != null ? edits.copy_count : entry.copy_count;
  const curNotes = edits.notes != null ? edits.notes : (entry.notes || '');
  const curCellStatus = entry.cell_status || '';
  const curCompanion = edits.companion != null ? edits.companion : (entry.companion || '');
  let h = '';
  h += '<label>Entry ID</label><input value="'+esc(entryId)+'" disabled style="background:#eee">';
  h += '<label>Taxon</label><input value="'+esc(entry.taxon.replace(/_/g,' '))+'" disabled style="background:#eee">';
  h += '<label>Copy count</label><input id="mCopies" type="text" inputmode="numeric" pattern="[0-9]*" value="'+v+'">';
  h += '<label>Cell Status</label><select id="mCellStatus"><option value=""'+(curCellStatus===''?' selected':'')+'>— not reviewed —</option><option value="checked"'+(curCellStatus==='checked'?' selected':'')+'>✓ Checked</option><option value="working"'+(curCellStatus==='working'?' selected':'')+'>⚠ Working</option></select>';
  h += '<label>Notes</label><textarea id="mNotes">'+esc(curNotes)+'</textarea>';
  h += '<label>Consensus sequence</label>';
  h += '<textarea id="mConsensus" style="font-family:monospace;font-size:10px;height:60px">'+esc(entry.seq || '')+'</textarea>';
  h += '<label>LINE partner / companion sequence</label>';
  h += '<textarea id="mCompanion" placeholder="Paste FASTA or raw sequence of the LINE partner or other companion…" style="font-family:monospace;font-size:10px;height:60px">'+esc(curCompanion)+'</textarea>';
  h += '<div style="margin-top:8px;font-size:10px;color:#666">';
  h += '<div><b>Header:</b> '+esc(entry.header || '')+'</div>';
  h += '<div><b>Sequence length:</b> '+(entry.seq ? entry.seq.length : 0)+' bp</div>';
  h += '</div>';
  showModal('Edit: '+entryId+' × '+entry.taxon.replace(/_/g,' '), h, function(ov){
    const newCopies = parseInt(ov.querySelector('#mCopies').value, 10) || 0;
    const newNotes = ov.querySelector('#mNotes').value.trim();
    const newCellStatus = ov.querySelector('#mCellStatus').value;
    let rawCons = ov.querySelector('#mConsensus').value.trim();
    if(rawCons){
      const lines = rawCons.split(/\n/).filter(l=>!l.startsWith('>'));
      rawCons = lines.join('').replace(/[^A-Za-z]/g,'').toUpperCase();
    }
    let rawComp = ov.querySelector('#mCompanion').value.trim();
    if(rawComp){
      const lines = rawComp.split(/\n/).filter(l=>!l.startsWith('>'));
      rawComp = lines.join('').replace(/[^A-Za-z]/g,'').toUpperCase();
    }
    if(!entry._edits) entry._edits = {};
    entry._edits.copy_count = newCopies;
    entry._edits.notes = newNotes;
    entry._edits.companion = rawComp || '';
    if(rawCons) entry._edits.consensus = rawCons;
    entry.copy_count = newCopies;
    entry.notes = newNotes;
    entry.companion = rawComp || '';
    if(rawCons) entry.seq = rawCons;
    if(newCellStatus) entry.cell_status = newCellStatus;
    else delete entry.cell_status;
    _saveEditsToLocalStorage();
    render();
  });
}

function exportJSON(){
  const out = JSON.parse(JSON.stringify(DATA));
  out.entries.forEach(e=>{ delete e._edits; delete e.cell_status; });
  const blob = new Blob([JSON.stringify(out,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = DATA.parent + '_sub_subfamilies.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

init();
</script>
</body>
</html>
