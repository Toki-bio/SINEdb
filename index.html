<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SINE-KB: SINE Knowledge Base</title>
<style>
/* === RESET & BASE === */
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#222;background:#fff}
a{color:#1a5dab;text-decoration:none}
a:hover{text-decoration:underline}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid #ccc;padding:2px 5px;text-align:left;vertical-align:top;white-space:nowrap}
th{background:#1a4d8c;color:#fff;font-weight:600;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none;font-size:11px}
th:hover{background:#15407a}
th .sort-arrow{font-size:9px;margin-left:2px;opacity:.6}
td{font-size:11px}
tr:nth-child(even){background:#f7f8fa}
tr:hover{background:#e8f0fe}
tr.selected{background:#cde4fc}
input,textarea,select{font:11px/1.3 inherit;border:1px solid #aaa;padding:1px 3px;background:#fffef5}
textarea{resize:vertical}
button{font:11px/1.3 inherit;padding:2px 8px;cursor:pointer;border:1px solid #888;background:#f0f0f0;border-radius:2px}
button:hover{background:#ddd}
button.primary{background:#1a4d8c;color:#fff;border-color:#1a4d8c}
button.primary:hover{background:#15407a}
button.danger{background:#c0392b;color:#fff;border-color:#c0392b}
button.danger:hover{background:#a93226}

/* === LAYOUT === */
#app{display:flex;height:100vh;flex-direction:column}
#topbar{display:flex;align-items:center;background:#1a4d8c;color:#fff;padding:0 8px;height:28px;flex-shrink:0;font-size:12px;gap:12px}
#topbar .title{font-weight:700;font-size:13px;letter-spacing:.5px}
#topbar .stats{font-size:11px;opacity:.85}
#topbar .actions{margin-left:auto;display:flex;gap:6px;align-items:center}
#topbar button{font-size:10px;padding:1px 6px;background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
#topbar button:hover{background:rgba(255,255,255,.3)}
#main{display:flex;flex:1;overflow:hidden}

/* Left panel */
#sidebar{width:220px;min-width:180px;max-width:320px;border-right:1px solid #ccc;display:flex;flex-direction:column;flex-shrink:0;background:#f5f6f8;font-size:11px;overflow:hidden}
#sidebar .panel-header{background:#2c3e50;color:#fff;padding:3px 6px;font-weight:600;font-size:11px;display:flex;justify-content:space-between;align-items:center}
#sidebar .tree{overflow-y:auto;flex:1;padding:2px 0}
.tree-node{padding:1px 0 1px 12px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-node:hover{background:#dce6f0}
.tree-node.active{background:#b8d4f0;font-weight:600}
.tree-toggle{display:inline-block;width:10px;font-size:9px;color:#666;text-align:center;cursor:pointer}
.tree-label{margin-left:2px}
.tree-count{color:#888;font-size:10px;margin-left:3px}
.tree-leaf{color:#1a5dab}
.tree-section{background:#e8ecf0;padding:2px 6px;font-weight:700;font-size:10px;text-transform:uppercase;color:#555;border-bottom:1px solid #ccc;border-top:1px solid #ccc;margin-top:2px}

/* Content area */
#content{flex:1;display:flex;flex-direction:column;overflow:hidden}
#tabs{display:flex;background:#e8ecf0;border-bottom:1px solid #ccc;flex-shrink:0}
.tab{padding:3px 12px;font-size:11px;cursor:pointer;border-right:1px solid #ccc;white-space:nowrap;user-select:none}
.tab:hover{background:#d0d8e0}
.tab.active{background:#fff;font-weight:600;border-bottom:1px solid #fff;margin-bottom:-1px}
#view{flex:1;overflow:auto;position:relative}
#view .table-wrap{overflow:auto;height:100%}

/* Detail pane (bottom) */
#detail{border-top:1px solid #ccc;height:0;overflow:hidden;transition:height .15s;background:#fafbfc}
#detail.open{height:260px;overflow:auto}
#detail .detail-header{background:#2c3e50;color:#fff;padding:3px 8px;font-size:11px;font-weight:600;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2}
#detail .detail-body{padding:6px 8px;font-size:11px}
#detail .detail-body table{width:auto}
#detail .detail-body th{background:#3a5068;font-size:10px;padding:2px 6px}
#detail .detail-body td{font-size:11px;padding:2px 6px;white-space:normal;max-width:600px;word-break:break-word}
.seq-display{font-family:"Courier New",Courier,monospace;font-size:11px;line-height:1.4;word-break:break-all;white-space:pre-wrap;background:#f0f0f0;padding:4px;border:1px solid #ddd;max-height:90px;overflow-y:auto;letter-spacing:0.5px}
.seq-display .A{color:#e74c3c}.seq-display .T{color:#2980b9}.seq-display .G{color:#27ae60}.seq-display .C{color:#8e44ad}.seq-display .N{color:#999}

/* Status bar */
#statusbar{height:18px;background:#f0f0f0;border-top:1px solid #ccc;display:flex;align-items:center;padding:0 8px;font-size:10px;color:#555;flex-shrink:0;gap:12px}
#statusbar .unsaved{color:#c0392b;font-weight:600}

/* Edit modal */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding-top:40px}
.modal{background:#fff;border:1px solid #666;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:700px;width:95%;max-height:85vh;overflow:auto;font-size:11px}
.modal-title{background:#1a4d8c;color:#fff;padding:4px 8px;font-weight:700;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.modal-title button{background:transparent;border:none;color:#fff;font-size:14px;cursor:pointer;padding:0 4px}
.modal-body{padding:8px}
.modal-body label{display:block;font-weight:600;margin:4px 0 1px;font-size:10px;color:#555;text-transform:uppercase}
.modal-body input,.modal-body textarea,.modal-body select{width:100%;margin-bottom:2px}
.modal-body textarea{height:50px}
.modal-body .seq-input{font-family:"Courier New",monospace;height:60px}
.modal-footer{padding:4px 8px 8px;text-align:right;display:flex;gap:6px;justify-content:flex-end}

/* Resize handle */
.resize-handle{width:4px;cursor:col-resize;background:transparent;flex-shrink:0}
.resize-handle:hover{background:#aaa}

/* Utility */
.hidden{display:none!important}
.text-right{text-align:right}
.text-center{text-align:center}
.mono{font-family:"Courier New",Courier,monospace}
.truncate{max-width:180px;overflow:hidden;text-overflow:ellipsis}
.num{text-align:right;font-variant-numeric:tabular-nums}

/* === SUMMARY TABLE === */
.summary-wrap{overflow:auto;height:100%}
.summary-controls{padding:4px 8px;border-bottom:1px solid #ccc;display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:11px;background:#f7f8fa;flex-shrink:0}
.summary-controls label{font-weight:600}
.summary-controls select,.summary-controls input[type=number]{width:auto;min-width:80px;font-size:11px;padding:1px 3px}
.summary-table{border-collapse:separate;border-spacing:0;font-size:10px}
.summary-table th,.summary-table td{border:1px solid #d0d0d0;padding:1px 3px;white-space:nowrap}
.summary-table thead th{position:sticky;top:0;z-index:4;background:#1a4d8c;color:#fff;font-size:10px;font-weight:600}
.summary-table thead tr:nth-child(2) th{top:22px;z-index:3}
/* Sticky species column */
.summary-table .sticky-species{position:sticky;left:0;z-index:2;background:#fff;border-right:2px solid #999;width:160px;min-width:160px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:normal;line-height:1.2}
.summary-table thead .sticky-species{z-index:5;background:#1a4d8c}
/* Sticky total column */
.summary-table .sticky-total{position:sticky;left:162px;z-index:2;background:#fff;border-right:2px solid #999;min-width:70px;text-align:right;font-weight:700}
.summary-table thead .sticky-total{z-index:5;background:#1a4d8c}
/* Ensure sticky cells keep solid bg on group headers, footer, hover */
.summary-table .group-header .sticky-species,.summary-table .group-header .sticky-total{background:#e0e6ed}
.summary-table tfoot .sticky-species,.summary-table tfoot .sticky-total{background:#e8ecf0}
.summary-table tr:hover .sticky-species,.summary-table tr:hover .sticky-total{background:#e8f0fe}
.summary-table thead tr:hover .sticky-species,.summary-table thead tr:hover .sticky-total{background:#1a4d8c}
/* Subfamily columns */
.summary-table .sf-col{min-width:42px;text-align:right;cursor:pointer;position:relative}
.summary-table .sf-col:hover{background:#e8f0fe !important}
.summary-table .sf-col .aln-dot{position:absolute;top:1px;right:1px;width:5px;height:5px;border-radius:50%;background:#2196f3;opacity:.6}
.aln-links{margin:6px 0;padding:4px 6px;background:#f0f6ff;border:1px solid #c0d4f0;border-radius:3px;font-size:10px}
.aln-links a{margin-right:8px;text-decoration:none;color:#1a4d8c;font-weight:600}
.aln-links a:hover{text-decoration:underline}
.summary-table .sf-vertical{writing-mode:vertical-lr;text-orientation:mixed;font-size:9px;max-width:30px;min-width:30px;cursor:pointer;padding:2px 1px}
.summary-table .sf-vertical:hover{background:#15407a}
.summary-table tfoot td{font-weight:700;background:#e8ecf0;border-top:2px solid #999}
.summary-table .group-header td{background:#e0e6ed;font-weight:700;font-size:10px;border-top:2px solid #888}
.summary-table tr:hover td:not(.group-header):not(.sticky-species):not(.sticky-total){background-color:rgba(232,240,254,.4)}
.summary-table .fam-hdr{background:#2c3e50;text-align:center;font-size:10px;letter-spacing:.5px}
/* heatmap */
.sc-high{background:#1a6b3c;color:#fff}.sc-med{background:#5ab87a;color:#000}.sc-low{background:#c8e6c9;color:#333}.sc-zero{background:#fff;color:#ccc}
/* curation */
.sc-fp{background:#f5f5f5;color:#bbb;text-decoration:line-through}
.sc-curated{outline:2px solid #e67e22;outline-offset:-2px}
.curation-box{margin:6px 0;padding:6px 8px;background:#fff8e1;border:1px solid #e6c35c;border-radius:3px;font-size:10px}
.curation-box .orig-val{font-weight:700;color:#555}
.curation-btns{margin:4px 0;display:flex;gap:6px;flex-wrap:wrap}
.curation-btns button{font-size:10px;padding:2px 8px}
.seq-list{max-height:300px;overflow-y:auto;border:1px solid #ccc;font-family:'Courier New',monospace;font-size:10px;background:#fafafa}
.seq-item{padding:2px 6px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px}
.seq-item:hover{background:#e8f0fe}
.seq-item.excluded{background:#fee;color:#999;text-decoration:line-through}
.seq-item label{flex:1;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Conservation histogram */
.conservation-container{margin:8px 0}
.conservation-canvas{width:100%;height:80px;border:1px solid #ddd;background:#fafafa;cursor:crosshair;display:block}
.conservation-legend{font-size:9px;color:#666;display:flex;gap:12px;margin-top:2px}
/* Annotation editor */
.annotation-types{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.annotation-type-btn{padding:2px 8px;border:2px solid rgba(0,0,0,.15);border-radius:3px;cursor:pointer;font-size:10px;font-weight:600;opacity:.7}
.annotation-type-btn.active{border-color:#333;box-shadow:0 0 0 1px #333;opacity:1}
.annotation-type-btn:hover{opacity:1}
.annotation-seq-wrap{overflow-y:auto;max-height:260px;border:1px solid #ccc;padding:4px;background:#fafafa;user-select:none;font-family:'Courier New',monospace}
.annotation-seq-row{white-space:nowrap;line-height:20px}
.ann-pos{display:inline-block;width:40px;text-align:right;padding-right:6px;color:#999;font-size:10px;user-select:none}
.ann-char{display:inline-block;width:8.4px;text-align:center;font-size:12px;cursor:crosshair}
.ann-char:hover{outline:1px solid #888}
.ann-char.drag-sel{outline:2px solid #333;outline-offset:-1px;z-index:1;position:relative}
.cartoon-legend{display:flex;flex-wrap:wrap;gap:8px;font-size:9px;margin-top:4px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <span class="title">SINE-KB</span>
    <span class="stats" id="topStats"></span>
    <div class="actions">
      <a href="squamata.html" style="color:#fff;font-size:10px;padding:1px 6px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:2px;text-decoration:none">Squamata Outgroups →</a>
      <button onclick="exportJSON()" title="Download data.json">Export JSON</button>
      <button onclick="exportFASTA()" title="Download all consensus sequences as FASTA">Export FASTA</button>
      <button onclick="document.getElementById('fileImport').click()" title="Import data.json">Import</button>
      <input type="file" id="fileImport" accept=".json" style="display:none" onchange="importJSON(event)">
      <button onclick="resetData()" title="Discard edits, reload original">Reset</button>
    </div>
  </div>
  <div id="main">
    <div id="sidebar">
      <div class="panel-header">Navigator</div>
      <div class="tree-section">Families</div>
      <div class="tree" id="famTree"></div>
      <div class="tree-section">Taxonomy</div>
      <div class="tree" id="taxTree"></div>
    </div>
    <div class="resize-handle" id="resizeHandle"></div>
    <div id="content">
      <div id="tabs">
        <div class="tab" data-tab="subfamilies">Subfamilies</div>
        <div class="tab" data-tab="families">Families</div>
        <div class="tab" data-tab="instances">Instances</div>
        <div class="tab" data-tab="taxonomy">Taxonomy</div>
        <div class="tab" data-tab="sequences">Sequences</div>
        <div class="tab active" data-tab="summary">Summary</div>
      </div>
      <div id="view"><div class="table-wrap" id="tableWrap"></div></div>
      <div id="detail">
        <div class="detail-header"><span id="detailTitle"></span><button onclick="closeDetail()">&times;</button></div>
        <div class="detail-body" id="detailBody"></div>
      </div>
    </div>
  </div>
  <div id="statusbar">
    <span id="statusRecords"></span>
    <span id="statusUnsaved" class="unsaved hidden">UNSAVED CHANGES</span>
    <span style="margin-left:auto" id="statusInfo"></span>
  </div>
</div>

<script>
// ===================== DATA LAYER =====================
let DATA = null;
let ORIGINAL = null;
let DIRTY = false;

function loadData(){
  const saved = localStorage.getItem('sinekb_data');
  if(saved){
    try{ DATA = JSON.parse(saved); DIRTY = true; }catch(e){ DATA = null; }
  }
  if(!DATA){
    return fetch('data.json').then(r=>r.json()).then(d=>{ DATA=d; ORIGINAL=JSON.stringify(d); init(); });
  }
  if(!ORIGINAL) fetch('data.json').then(r=>r.json()).then(d=>{ ORIGINAL=JSON.stringify(d); }).catch(()=>{});
  init();
}

function save(){
  localStorage.setItem('sinekb_data', JSON.stringify(DATA));
  DIRTY = true;
  updateStatus();
}

function resetData(){
  if(!confirm('Discard all edits and reload original data?')) return;
  localStorage.removeItem('sinekb_data');
  DIRTY = false;
  if(ORIGINAL) DATA = JSON.parse(ORIGINAL);
  else location.reload();
  init();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(DATA,null,2)], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='data.json'; a.click();
}

function exportFASTA(){
  let fa = '';
  for(const fam of DATA.families){
    for(const sf of fam.subfamilies||[]){
      fa += '>' + (sf.id||sf.name) + ' ' + sf.name + ' [' + fam.name + '] len=' + (sf.length||'') + '\n';
      const seq = sf.sequence||'';
      for(let i=0;i<seq.length;i+=80) fa += seq.slice(i,i+80)+'\n';
    }
  }
  const blob = new Blob([fa], {type:'text/plain'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='sinekb_consensus.fa'; a.click();
}

function importJSON(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = function(){ try{ DATA=JSON.parse(r.result); save(); init(); }catch(e){ alert('Invalid JSON'); } };
  r.readAsText(f);
  ev.target.value='';
}

// ===================== DERIVED DATA =====================
function allSubfamilies(){
  const rows=[];
  for(const fam of DATA.families){
    for(const sf of fam.subfamilies||[]){
      rows.push({...sf, _family: fam.name, _familyHead: fam.head_type});
    }
  }
  return rows;
}

function allInstances(){
  const rows=[];
  for(const fam of DATA.families){
    for(const sf of fam.subfamilies||[]){
      for(const inst of sf.instances||[]){
        rows.push({...inst, _family: fam.name, _subfamily: sf.name, _sfId: sf.id});
      }
    }
  }
  return rows;
}

// ===================== INIT =====================
let currentTab = 'summary';
let sortCol = null, sortDir = 1;
let filterFamily = null;
let filterTaxon = null;

function init(){
  buildSidebar();
  renderTab();
  updateStatus();
}

function updateStatus(){
  const sfs = allSubfamilies();
  const insts = allInstances();
  const totalCopies = insts.reduce((s,i)=>s+(i.copy_count||0),0);
  document.getElementById('topStats').textContent =
    DATA.families.length + ' families | ' + sfs.length + ' subfamilies | ' + insts.length + ' instances | ' + totalCopies.toLocaleString() + ' total copies';
  document.getElementById('statusRecords').textContent = 'Records: ' + sfs.length + ' subfamilies, ' + insts.length + ' instances';
  const u = document.getElementById('statusUnsaved');
  if(DIRTY){ u.classList.remove('hidden'); } else { u.classList.add('hidden'); }
}

// ===================== SIDEBAR =====================
function buildSidebar(){
  var html = '';
  for(var fi=0; fi<DATA.families.length; fi++){
    var fam = DATA.families[fi];
    var sfCount = (fam.subfamilies||[]).length;
    var isActive = filterFamily === fam.name;
    html += '<div class="tree-node' + (isActive?' active':'') + '" onclick="toggleFamilyFilter(\'' + q(fam.name) + '\')" title="' + esc(fam.description||'') + '">';
    html += '<span class="tree-toggle">' + (sfCount>0?'&#9654;':'') + '</span>';
    html += '<span class="tree-label">' + esc(fam.name) + '</span>';
    html += '<span class="tree-count">(' + sfCount + ')</span>';
    html += '</div>';
    if(isActive){
      for(var si=0; si<(fam.subfamilies||[]).length; si++){
        var sf = fam.subfamilies[si];
        var copies = (sf.instances||[]).reduce(function(s,i){return s+(i.copy_count||0);},0);
        html += '<div class="tree-node" style="padding-left:24px" onclick="showSubfamilyDetail(\'' + q(fam.name) + '\',\'' + q(sf.name) + '\')" title="' + esc(sf.id||'') + '">';
        html += '<span class="tree-leaf">' + esc(sf.name) + '</span>';
        html += '<span class="tree-count">' + (copies?copies.toLocaleString():'-') + '</span>';
        html += '</div>';
      }
    }
  }
  document.getElementById('famTree').innerHTML = html;

  var taxHtml = '';
  function renderTaxNode(node, depth){
    if(node.taxon){
      var isAct = filterTaxon === node.taxon;
      taxHtml += '<div class="tree-node' + (isAct?' active':'') + '" style="padding-left:' + (8+depth*10) + 'px" onclick="toggleTaxonFilter(\'' + q(node.taxon) + '\')">';
      taxHtml += '<span class="tree-leaf">' + esc(node.taxon.replace(/_/g,' ')) + '</span>';
      if(node.ncbi_taxid) taxHtml += '<span class="tree-count">' + node.ncbi_taxid + '</span>';
      taxHtml += '</div>';
    } else {
      taxHtml += '<div class="tree-node" style="padding-left:' + (8+depth*10) + 'px;font-weight:600;color:#444">';
      taxHtml += esc(node.name);
      taxHtml += '</div>';
      for(var ci=0; ci<(node.children||[]).length; ci++) renderTaxNode(node.children[ci], depth+1);
    }
  }
  for(var ti=0; ti<(DATA.taxonomy||[]).length; ti++) renderTaxNode(DATA.taxonomy[ti], 0);
  document.getElementById('taxTree').innerHTML = taxHtml;
}

function toggleFamilyFilter(name){
  filterFamily = filterFamily===name ? null : name;
  buildSidebar();
  renderTab();
}

function toggleTaxonFilter(name){
  filterTaxon = filterTaxon===name ? null : name;
  buildSidebar();
  renderTab();
}

// ===================== TABS =====================
document.getElementById('tabs').addEventListener('click', function(e){
  var tab = e.target.closest('.tab');
  if(!tab) return;
  document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('active');});
  tab.classList.add('active');
  currentTab = tab.dataset.tab;
  sortCol = null; sortDir = 1;
  closeDetail();
  renderTab();
});

function renderTab(){
  closeDetail();
  // Summary tab uses full width — hide sidebar and expand
  var sidebar = document.getElementById('sidebar');
  var resizeHandle = document.getElementById('resizeHandle');
  if(currentTab === 'summary'){
    sidebar.style.display = 'none';
    resizeHandle.style.display = 'none';
  } else {
    sidebar.style.display = '';
    resizeHandle.style.display = '';
  }
  switch(currentTab){
    case 'subfamilies': renderSubfamilies(); break;
    case 'families': renderFamilies(); break;
    case 'instances': renderInstances(); break;
    case 'taxonomy': renderTaxonomy(); break;
    case 'sequences': renderSequences(); break;
    case 'summary': renderSummary(); break;
  }
}

// ===================== SORTING =====================
function sortBy(col){
  if(sortCol===col) sortDir*=-1;
  else { sortCol=col; sortDir=1; }
  renderTab();
}

function sortRows(rows, col, dir){
  if(!col) return rows;
  return rows.slice().sort(function(a,b){
    var va=a[col], vb=b[col];
    if(va==null) va='';
    if(vb==null) vb='';
    if(typeof va==='number'&&typeof vb==='number') return (va-vb)*dir;
    return String(va).localeCompare(String(vb),'en',{numeric:true})*dir;
  });
}

function thHtml(col, label){
  var arrow = '';
  if(sortCol===col) arrow = '<span class="sort-arrow">' + (sortDir>0?'&#9650;':'&#9660;') + '</span>';
  return '<th onclick="sortBy(\'' + col + '\')">' + label + arrow + '</th>';
}

// ===================== SUBFAMILIES TABLE =====================
function renderSubfamilies(){
  var rows = allSubfamilies();
  if(filterFamily) rows = rows.filter(function(r){return r._family===filterFamily;});

// ===================== TAXONOMY TABLE =====================
function renderTaxonomy(){
  var rows = [];
  function flatten(node, path, depth){
    if(node.taxon){
      var totalCopies = 0, sfCount = 0;
      for(var fi=0;fi<DATA.families.length;fi++){
        var fam=DATA.families[fi];
        for(var si=0;si<(fam.subfamilies||[]).length;si++){
          var sf=fam.subfamilies[si];
          for(var ii=0;ii<(sf.instances||[]).length;ii++){
            if(sf.instances[ii].taxon===node.taxon){ totalCopies += sf.instances[ii].copy_count||0; sfCount++; }
          }
        }
      }
      rows.push({taxon:node.taxon, ncbi_taxid:node.ncbi_taxid, common_name:node.common_name||'', path:path, depth:depth, totalCopies:totalCopies, sfCount:sfCount});
    } else {
      rows.push({clade:node.name, path:path, depth:depth, childCount:(node.children||[]).length});
      for(var ci=0;ci<(node.children||[]).length;ci++) flatten(node.children[ci], path+' > '+(node.children[ci].name||node.children[ci].taxon||''), depth+1);
    }
  }
  for(var ti=0;ti<(DATA.taxonomy||[]).length;ti++) flatten(DATA.taxonomy[ti], DATA.taxonomy[ti].name, 0);

  var html = '<table id="dataTable"><thead><tr>';
  html += '<th>Hierarchy</th><th>Name</th><th>Type</th><th>NCBI TaxID</th><th>Common name</th><th>SINE subfamilies</th><th>Total copies</th>';
  html += '</tr></thead><tbody>';

  for(var i=0;i<rows.length;i++){
    var r = rows[i];
    var indent = r.depth * 16;
    if(r.clade){
      html += '<tr style="background:#eef2f7"><td style="padding-left:' + (indent+4) + 'px;font-weight:600">' + esc(r.clade) + '</td><td></td><td>clade</td><td></td><td></td><td class="num">' + r.childCount + ' children</td><td></td></tr>';
    } else {
      html += '<tr><td style="padding-left:' + (indent+4) + 'px"><i>' + esc(r.taxon.replace(/_/g,' ')) + '</i></td>';
      html += '<td>' + esc(r.taxon) + '</td><td>species</td>';
      html += '<td class="num">' + (r.ncbi_taxid||'') + '</td>';
      html += '<td>' + esc(r.common_name) + '</td>';
      html += '<td class="num">' + (r.sfCount||'-') + '</td>';
      html += '<td class="num">' + (r.totalCopies?r.totalCopies.toLocaleString():'-') + '</td>';
      html += '</tr>';
    }
  }
  html += '</tbody></table>';

  document.getElementById('tableWrap').innerHTML = html;
  document.getElementById('statusInfo').textContent = rows.length + ' taxonomy nodes';
}

// ===================== SEQUENCE COLORING =====================
function colorSeq(seq){
  var out = '';
  for(var i=0;i<seq.length;i++){
    var c = seq[i];
    var u = c.toUpperCase();
    if('ATGCN'.indexOf(u)>=0) out += '<span class="' + u + '">' + c + '</span>';
    else out += c;
  }
  return out;
}

// ===================== EDIT MODALS =====================
function showModal(title, bodyHtml, onSave){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal">' +
    '<div class="modal-title"><span>' + title + '</span><button onclick="this.closest(\'.modal-overlay\').remove()">&times;</button></div>' +
    '<div class="modal-body">' + bodyHtml + '</div>' +
    '<div class="modal-footer">' +
      '<button onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>' +
      '<button class="primary" id="modalSaveBtn">Save</button>' +
    '</div>' +
  '</div>';
  document.body.appendChild(overlay);
  overlay.querySelector('#modalSaveBtn').addEventListener('click', function(){
    if(onSave(overlay)!==false) overlay.remove();
  });
  overlay.addEventListener('click', function(e){ if(e.target===overlay) overlay.remove(); });
  var first = overlay.querySelector('input,textarea,select');
  if(first) setTimeout(function(){first.focus();}, 50);
}

    inst.stats.sim_median = parseFloat(ov.querySelector('#mSimMedian').value) || null;

// ===================== SUMMARY TABLE =====================
function buildSummaryData(){
  // Collect all subfamilies grouped by family
  var sineGroups = [];
  for(var fi=0; fi<DATA.families.length; fi++){
    var fam = DATA.families[fi];
    var sfs = (fam.subfamilies||[]).map(function(sf){ return sf.name; });
    if(sfs.length) sineGroups.push({name:fam.name, subfamilies:sfs});
  }
  var allSfNames = [];
  sineGroups.forEach(function(g){ allSfNames = allSfNames.concat(g.subfamilies); });

  // Collect all species from taxonomy (leaf nodes), grouped by immediate parent clade
  var taxGroups = [];
  var groupMap = {};
  var taxonSet = {};

  function ensureGroup(name){
    var gname = name || 'Other';
    if(!groupMap[gname]) groupMap[gname] = {name:gname, species:[]};
    return groupMap[gname];
  }

  function walkTax(node, parentName){
    if(node.taxon){
      if(!taxonSet[node.taxon]){
        var grp = ensureGroup(parentName);
        grp.species.push({taxon:node.taxon, common_name:node.common_name||'', ncbi_taxid:node.ncbi_taxid||null});
        taxonSet[node.taxon] = true;
      }
      return;
    }
    var children = node.children || [];
    var nextParent = node.name || parentName;
    for(var ci=0; ci<children.length; ci++) walkTax(children[ci], nextParent);
  }

  for(var ti=0; ti<(DATA.taxonomy||[]).length; ti++) walkTax(DATA.taxonomy[ti], null);

  Object.keys(groupMap).forEach(function(k){
    if(groupMap[k].species.length) taxGroups.push(groupMap[k]);
  });

  // Add species that have instances but aren't in taxonomy
  var ungrouped = [];
  for(var fi2=0; fi2<DATA.families.length; fi2++){
    for(var si2=0; si2<(DATA.families[fi2].subfamilies||[]).length; si2++){
      var sf2 = DATA.families[fi2].subfamilies[si2];
      for(var ii2=0; ii2<(sf2.instances||[]).length; ii2++){
        var tx = sf2.instances[ii2].taxon;
        if(tx && !taxonSet[tx]){ taxonSet[tx]=true; ungrouped.push({taxon:tx, common_name:'', ncbi_taxid:null}); }
      }
    }
  }
  if(ungrouped.length) taxGroups.push({name:'Other', species:ungrouped});

  // Build copy count map: taxon -> subfam -> {total, firm, sim_mean}
  var countMap = {};
  for(var fi3=0; fi3<DATA.families.length; fi3++){
    for(var si3=0; si3<(DATA.families[fi3].subfamilies||[]).length; si3++){
      var sf3 = DATA.families[fi3].subfamilies[si3];
      for(var ii3=0; ii3<(sf3.instances||[]).length; ii3++){
        var inst = sf3.instances[ii3];
        if(!inst.taxon) continue;
        if(!countMap[inst.taxon]) countMap[inst.taxon] = {};
        countMap[inst.taxon][sf3.name] = {
          total: inst.copy_count||0,
          sim_mean: (inst.stats&&inst.stats.sim_mean)||null,
          sim_median: (inst.stats&&inst.stats.sim_median)||null,
          alignments: inst.alignments||null,
          curated: inst.curated||false,
          original_copy_count: inst.original_copy_count,
          status: inst.status||'present',
          excluded_seqs: inst.excluded_seqs||[]
        };
      }
    }
  }

  return {sineGroups:sineGroups, allSfNames:allSfNames, taxGroups:taxGroups, countMap:countMap};
}

function renderSummary(){
  var d = buildSummaryData();
  var sineGroups = d.sineGroups, allSfNames = d.allSfNames, taxGroups = d.taxGroups, countMap = d.countMap;

  // Count total species
  var totalSpecies = 0;
  taxGroups.forEach(function(g){ totalSpecies += g.species.length; });

  var html = '';
  // Controls
  html += '<div class="summary-controls">';
  html += '<label>Filter family:</label>';
  html += '<select id="sumFamFilter" onchange="filterSummary()">';
  html += '<option value="">All families</option>';
  sineGroups.forEach(function(g){ html += '<option value="'+esc(g.name)+'">'+esc(g.name)+'</option>'; });
  html += '</select>';
  html += '<label>Min copies:</label>';
  html += '<input type="number" id="sumMinCopies" value="0" min="0" style="width:70px" onchange="filterSummary()">';
  html += '<label><input type="checkbox" id="sumHideZero" onchange="filterSummary()"> Hide empty columns</label>';
  html += '<label><input type="checkbox" id="sumShowCurated" onchange="filterSummary()"> Highlight curated</label>';
  html += '<span style="margin-left:auto;color:#666">' + totalSpecies + ' species × ' + allSfNames.length + ' subfamilies</span>';
  html += '</div>';

  // Table
  html += '<div class="summary-wrap"><table class="summary-table" id="sumTable">';

  // Header row 1: family groups
  html += '<thead><tr>';
  html += '<th class="sticky-species" rowspan="2" style="cursor:pointer" onclick="sortSummary(\'species\')">Species ⇕</th>';
  html += '<th class="sticky-total" rowspan="2" style="cursor:pointer" onclick="sortSummary(\'total\')">Total ⇕</th>';
  var sfStart = 0;
  sineGroups.forEach(function(g){
    html += '<th class="fam-hdr" data-start="'+sfStart+'" data-count="'+g.subfamilies.length+'" colspan="'+g.subfamilies.length+'">'+esc(g.name)+'</th>';
    sfStart += g.subfamilies.length;
  });
  html += '</tr>';

  // Header row 2: subfamily names (vertical)
  html += '<tr>';
  allSfNames.forEach(function(sfn, idx){
    html += '<th class="sf-vertical" data-sf="'+esc(sfn)+'" onclick="sortSummary('+idx+')">'+esc(sfn)+'</th>';
  });
  html += '</tr></thead>';

  // Body: grouped by taxonomy family
  html += '<tbody>';
  taxGroups.forEach(function(grp){
    // Group header row
    html += '<tr class="group-header"><td class="sticky-species"><strong>'+esc(grp.name)+'</strong></td>';
    html += '<td class="sticky-total"></td>';
    for(var gi=0; gi<allSfNames.length; gi++) html += '<td></td>';
    html += '</tr>';

    grp.species.forEach(function(sp){
      var rowCounts = countMap[sp.taxon]||{};
      var rowTotal = 0;
      allSfNames.forEach(function(sfn){ rowTotal += (rowCounts[sfn]?rowCounts[sfn].total:0); });

      html += '<tr data-taxon="'+esc(sp.taxon)+'" data-group="'+esc(grp.name)+'" data-total="'+rowTotal+'">';
      html += '<td class="sticky-species"><i>'+esc(sp.taxon.replace(/_/g,' '))+'</i>';
      if(sp.common_name) html += '<br><span style="color:#888;font-size:9px">'+esc(sp.common_name)+'</span>';
      html += '</td>';
      html += '<td class="sticky-total">'+formatN(rowTotal)+'</td>';

      allSfNames.forEach(function(sfn){
        var v = rowCounts[sfn];
        var val = v ? v.total : 0;
        var isFP = v && v.status==='false_positive';
        var isCurated = v && v.curated;
        var cls = isFP?'sc-fp':val>1000?'sc-high':val>100?'sc-med':val>0?'sc-low':'sc-zero';
        if(isCurated && !isFP) cls += ' sc-curated';
        var tip = sfn+' in '+sp.taxon.replace(/_/g,' ')+': '+(val?val.toLocaleString():'0')+' copies';
        if(isCurated && v.original_copy_count!=null) tip += ' (original: '+v.original_copy_count+')';
        if(isFP) tip += ' [FALSE POSITIVE]';
        if(v && v.sim_mean!=null) tip += ' (sim='+v.sim_mean.toFixed(3)+')';
        html += '<td class="sf-col '+cls+'" data-sf="'+esc(sfn)+'" data-taxon="'+esc(sp.taxon)+'" data-val="'+val+'"';
        html += ' title="'+esc(tip)+'"';
        html += ' onclick="editSumCell(this,\''+q(sp.taxon)+'\',\''+q(sfn)+'\')"';
        var hasAln = v && v.alignments;
        html += '>'+(isFP?'<s style="color:#bbb">'+(v.original_copy_count||val?formatN(v.original_copy_count||val):'')+'</s>':(val?formatN(val):''))+(hasAln?'<span class="aln-dot" title="Alignments available"></span>':'')+'</td>';
      });
      html += '</tr>';
    });
  });
  html += '</tbody>';

  // Footer: totals
  html += '<tfoot><tr>';
  html += '<td class="sticky-species"><strong>Totals</strong></td>';
  var grandTotal = 0;
  var sfTotals = {};
  allSfNames.forEach(function(sfn){ sfTotals[sfn]=0; });
  taxGroups.forEach(function(grp){
    grp.species.forEach(function(sp){
      var rc = countMap[sp.taxon]||{};
      allSfNames.forEach(function(sfn){
        var v = rc[sfn]?rc[sfn].total:0;
        sfTotals[sfn] += v;
        grandTotal += v;
      });
    });
  });
  html += '<td class="sticky-total">'+formatN(grandTotal)+'</td>';
  allSfNames.forEach(function(sfn){
    html += '<td class="sf-col" style="font-weight:700">'+(sfTotals[sfn]?formatN(sfTotals[sfn]):'')+'</td>';
  });
  html += '</tr></tfoot>';

  html += '</table></div>';

  document.getElementById('tableWrap').innerHTML = html;
  filterSummary();
  document.getElementById('statusInfo').textContent = totalSpecies + ' species, ' + allSfNames.length + ' subfamilies, ' + grandTotal.toLocaleString() + ' total copies';
}

function formatN(n){ return n ? n.toLocaleString() : ''; }

// --- Summary filtering ---
function filterSummary(){
  var famFilter = document.getElementById('sumFamFilter').value;
  var minC = parseInt(document.getElementById('sumMinCopies').value)||0;
  var hideZero = document.getElementById('sumHideZero').checked;
  var rows = document.querySelectorAll('#sumTable tbody tr');

  // Show/hide subfamily columns by family
  var sfHeaders = document.querySelectorAll('#sumTable .sf-vertical');
  var visibleSfIdx = {};
  sfHeaders.forEach(function(h, idx){
    var sfn = h.dataset.sf;
    var famMatch = true;
    if(famFilter){
      var found = false;
      DATA.families.forEach(function(fam){
        if(fam.name===famFilter){
          (fam.subfamilies||[]).forEach(function(sf){ if(sf.name===sfn) found=true; });
        }
      });
      if(!found) famMatch = false;
    }
    // Check if column has any data
    var hasData = true;
    if(hideZero){
      hasData = false;
      rows.forEach(function(row){
        if(row.classList.contains('group-header')) return;
        var cells = row.querySelectorAll('.sf-col');
        if(cells[idx]){
          var v = parseInt(cells[idx].dataset.val)||0;
          if(v>0) hasData = true;
        }
      });
    }
    var show = famMatch && hasData;
    h.style.display = show ? '' : 'none';
    visibleSfIdx[idx] = show;
    // fam header colspan needs adjustment — complex, skip for now
  });

  // Show/hide cells
  rows.forEach(function(row){
    if(row.classList.contains('group-header')){
      var cells = row.querySelectorAll('td');
      cells.forEach(function(c, ci){ if(ci>=2) c.style.display = visibleSfIdx[ci-2]===false?'none':''; });
      return;
    }

    var rowTotal = parseInt(row.dataset.total)||0;
    row.style.display = rowTotal >= minC ? '' : 'none';

    var sfCells = row.querySelectorAll('.sf-col');
    sfCells.forEach(function(c, idx){ c.style.display = visibleSfIdx[idx]===false?'none':''; });
  });

  // Hide group headers with no visible member rows
  var tbody = document.querySelector('#sumTable tbody');
  if(tbody){
    var allRows = Array.from(tbody.querySelectorAll('tr'));
    var groupHeader = null;
    var hasVisible = false;
    allRows.forEach(function(r){
      if(r.classList.contains('group-header')){
        if(groupHeader) groupHeader.style.display = hasVisible ? '' : 'none';
        groupHeader = r;
        hasVisible = false;
      } else if(r.style.display !== 'none') {
        hasVisible = true;
      }
    });
    if(groupHeader) groupHeader.style.display = hasVisible ? '' : 'none';
  }

  // Footer
  var footCells = document.querySelectorAll('#sumTable tfoot .sf-col');
  footCells.forEach(function(c, idx){ c.style.display = visibleSfIdx[idx]===false?'none':''; });

  // fam header row
  var famHdrs = document.querySelectorAll('#sumTable .fam-hdr');
  if(famHdrs.length){
    famHdrs.forEach(function(h){
      var sfIdx = parseInt(h.dataset.start)||0;
      var count = parseInt(h.dataset.count)||0;
      var visCount = 0;
      for(var si=0; si<count; si++){
        if(visibleSfIdx[sfIdx+si]!==false) visCount++;
      }
      h.colSpan = Math.max(1, visCount);
      h.style.display = visCount===0?'none':'';
    });
  }
}

// --- Summary sorting ---
var sumSortCol = null, sumSortDir = 1;
function sortSummary(col){
  if(sumSortCol===col) sumSortDir *= -1;
  else { sumSortCol = col; sumSortDir = 1; }

  var tbody = document.querySelector('#sumTable tbody');
  if(!tbody) return;
  var rows = Array.from(tbody.querySelectorAll('tr'));

  // Separate group headers and data rows
  var groups = [];
  var currentGrp = null;
  rows.forEach(function(row){
    if(row.classList.contains('group-header')){
      currentGrp = {header: row, rows: []};
      groups.push(currentGrp);
    } else if(currentGrp) {
      currentGrp.rows.push(row);
    }
  });

  // Sort within each group
  groups.forEach(function(g){
    g.rows.sort(function(a,b){
      var va, vb;
      if(col==='species'){
        va = a.dataset.taxon||''; vb = b.dataset.taxon||'';
        return va.localeCompare(vb) * sumSortDir;
      } else if(col==='total'){
        va = parseInt(a.dataset.total)||0; vb = parseInt(b.dataset.total)||0;
        return (vb-va)*sumSortDir;
      } else {
        var cellsA = a.querySelectorAll('.sf-col');
        var cellsB = b.querySelectorAll('.sf-col');
        va = parseInt(cellsA[col]?cellsA[col].dataset.val:0)||0;
        vb = parseInt(cellsB[col]?cellsB[col].dataset.val:0)||0;
        return (vb-va)*sumSortDir;
      }
    });
  });

  // Re-append
  while(tbody.firstChild) tbody.removeChild(tbody.firstChild);
  groups.forEach(function(g){
    tbody.appendChild(g.header);
    g.rows.forEach(function(r){ tbody.appendChild(r); });
  });
}

}

function _findSfInst(sfName, taxon){
  var fam=null, sf=null, inst=null;
  for(var fi=0;fi<DATA.families.length;fi++){
    for(var si=0;si<(DATA.families[fi].subfamilies||[]).length;si++){
      if(DATA.families[fi].subfamilies[si].name===sfName){
        fam=DATA.families[fi]; sf=DATA.families[fi].subfamilies[si]; break;
      }
    }
    if(sf) break;
  }
  if(sf && taxon) inst=(sf.instances||[]).find(function(i){return i.taxon===taxon;});
  return {fam:fam, sf:sf, inst:inst};
}

// --- Mark as false positive: zero out but preserve original ---
function markFalsePositive(famName, sfName, taxon){
  var r = _findSfInst(sfName, taxon);
  if(!r.inst) return;
  var inst = r.inst;
  if(inst.original_copy_count==null) inst.original_copy_count = inst.copy_count;
  inst.copy_count = 0;
  inst.status = 'false_positive';
  inst.curated = true;
  inst.curated_date = today();
  if(!inst.curation_notes) inst.curation_notes = 'Marked as false positive';
  save(); renderSummary();
}

// --- Restore original pipeline values ---
function restoreOriginal(famName, sfName, taxon){
  if(!confirm('Restore original pipeline values for '+sfName+' × '+taxon.replace(/_/g,' ')+'?')) return;
  var r = _findSfInst(sfName, taxon);
  if(!r.inst) return;
  var inst = r.inst;
  if(inst.original_copy_count!=null) inst.copy_count = inst.original_copy_count;
  delete inst.original_copy_count;
  delete inst.curated;
  delete inst.curated_date;
  delete inst.excluded_seqs;
  inst.status = 'present';
  inst.curation_notes = '';
  inst.last_modified = today();
  save(); renderSummary();
}

// --- Curate alignment: fetch FASTA, show sequences, allow exclusion ---
function curateAlignment(famName, sfName, taxon){
  var r = _findSfInst(sfName, taxon);
  if(!r.inst || !r.inst.alignments || !r.inst.alignments.core) return;
  var inst = r.inst;
  var corePath = inst.alignments.core;
  var excluded = inst.excluded_seqs || [];

  // Fetch the FASTA file
  fetch(SINEDB_BASE + corePath).then(function(resp){
    if(!resp.ok) throw new Error('Failed to fetch '+corePath);
    return resp.text();
  }).then(function(fasta){
    // Parse FASTA: extract headers
    var seqs = [];
    var lines = fasta.split('\n');
    var curName = null, curSeq = '';
    for(var li=0; li<lines.length; li++){
      var ln = lines[li].trim();
      if(ln.startsWith('>')){
        if(curName!=null) seqs.push({name:curName, len:curSeq.replace(/-/g,'').length, seq:curSeq});
        curName = ln.substring(1).split(/\s+/)[0];
        curSeq = '';
      } else {
        curSeq += ln;
      }
    }
    if(curName!=null) seqs.push({name:curName, len:curSeq.replace(/-/g,'').length, seq:curSeq});

    // Build modal with sequence list
    var origN = inst.original_copy_count!=null ? inst.original_copy_count : inst.copy_count;
    var body = '<div style="font-size:11px;margin-bottom:6px">';
    body += '<strong>'+sfName+'</strong> in <i>'+taxon.replace(/_/g,' ')+'</i> — '+seqs.length+' sequences in core alignment';
    if(origN > seqs.length) body += ' (out of '+origN.toLocaleString()+' total hits)';
    body += '<br>Uncheck sequences that are false positives. Excluded sequences will be tracked.';
    body += '</div>';
    body += '<div style="margin-bottom:4px"><button onclick="document.querySelectorAll(\'.seq-cb\').forEach(function(c){c.checked=true})">Select All</button> ';
    body += '<button onclick="document.querySelectorAll(\'.seq-cb\').forEach(function(c){c.checked=false})">Select None</button></div>';
    body += '<div class="seq-list">';
    for(var si=0; si<seqs.length; si++){
      var s = seqs[si];
      var isExcl = excluded.indexOf(s.name) >= 0;
      body += '<div class="seq-item'+(isExcl?' excluded':'')+'">';
      body += '<input type="checkbox" class="seq-cb" data-name="'+esc(s.name)+'"'+(isExcl?'':' checked')+'>';
      body += '<label title="'+esc(s.name)+'">'+esc(s.name)+' <span style="color:#888">('+s.len+' bp)</span></label>';
      body += '</div>';
    }
    body += '</div>';
    body += '<label>Curation notes</label><textarea id="mCurNotes2">'+esc(inst.curation_notes||'')+'</textarea>';

    showModal('Curate: '+sfName+' × '+taxon.replace(/_/g,' '), body, function(ov){
      var newExcluded = [];
      var checkboxes = ov.querySelectorAll('.seq-cb');
      checkboxes.forEach(function(cb){
        if(!cb.checked) newExcluded.push(cb.dataset.name);
      });
      inst.excluded_seqs = newExcluded;
      inst.curation_notes = ov.querySelector('#mCurNotes2').value.trim();

      // Adjust copy count based on exclusions
      if(inst.original_copy_count==null && newExcluded.length>0){
        inst.original_copy_count = inst.copy_count;
      }
      if(inst.original_copy_count!=null){
        var orig = inst.original_copy_count;
        if(orig <= seqs.length){
          // Low-copy: count = included sequences
          inst.copy_count = seqs.length - newExcluded.length;
        } else {
          // High-copy: scale proportionally
          var keepRatio = (seqs.length - newExcluded.length) / seqs.length;
          inst.copy_count = Math.round(orig * keepRatio);
        }
      }
      if(newExcluded.length > 0){
        inst.curated = true;
        inst.curated_date = today();
        if(inst.copy_count === 0) inst.status = 'false_positive';
      } else if(inst.original_copy_count!=null){
        // All included again — restore
        inst.copy_count = inst.original_copy_count;
        delete inst.original_copy_count;
        inst.curated = false;
      }
      inst.last_modified = today();
      save(); renderSummary();
    });
  }).catch(function(err){
    alert('Could not fetch alignment: '+err.message+'\n\nYou can still manually edit the copy count in the cell editor.');
  });
}

function deleteSumInstance(famName, sfName, taxon){
  if(!confirm('Delete instance "'+taxon+'" from '+sfName+'?')) return;
  var fam = DATA.families.find(function(f){return f.name===famName;});

  if(sf) sf.instances = (sf.instances||[]).filter(function(i){return i.taxon!==taxon;});

// ===================== CONSERVATION HISTOGRAM =====================

function parseFasta(text){
  var seqs=[]; var lines=text.split('\n'); var nm=null,sq='';
  for(var i=0;i<lines.length;i++){
    var ln=lines[i].trim();
    if(ln.charAt(0)==='>'){
      if(nm!=null) seqs.push({name:nm,seq:sq});
      nm=ln.substring(1).split(/\s+/)[0]; sq='';
    } else sq+=ln;
  }
  if(nm!=null) seqs.push({name:nm,seq:sq});
  return seqs;
}

function calcConservation(seqs){
  if(!seqs.length) return [];
  var len=0; seqs.forEach(function(s){if(s.seq.length>len)len=s.seq.length;});
  var res=[];
  for(var p=0;p<len;p++){
    var ct={A:0,T:0,G:0,C:0}; var gap=0,total=seqs.length;
    for(var si=0;si<seqs.length;si++){
      var c=(seqs[si].seq[p]||'-').toUpperCase();
      if(c==='U')c='T';
      if(c==='-'||c==='N') gap++;
      else if(ct[c]!==undefined) ct[c]++;
      else gap++;
    }
    var nonGap=total-gap; var mx=0,dom='N';
    ['A','T','G','C'].forEach(function(b){if(ct[b]>mx){mx=ct[b];dom=b;}});
    res.push({pos:p, cons:nonGap>0?mx/nonGap:0, gapFrac:gap/total, dom:dom, nonGap:nonGap, total:total});
  }
  return res;
}

function showConservation(sfName,taxon,container){
  var r=_findSfInst(sfName,taxon);
  if(!r.inst||!r.inst.alignments){container.innerHTML='<div style="color:#999;font-size:10px;padding:4px">No alignment data available</div>';return;}
  var path=r.inst.alignments.core||r.inst.alignments.best50||r.inst.alignments.subfam;
  if(!path){container.innerHTML='<div style="color:#999;font-size:10px;padding:4px">No alignment file</div>';return;}
  container.innerHTML='<div style="color:#888;font-size:10px;padding:4px">Loading alignment for conservation analysis...</div>';
  fetch(SINEDB_BASE+path).then(function(resp){
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    return resp.text();
  }).then(function(fasta){
    var seqs=parseFasta(fasta);
    if(seqs.length<2){container.innerHTML='<div style="color:#999;font-size:10px">Only '+seqs.length+' sequence — need ≥2 for conservation</div>';return;}
    var cons=calcConservation(seqs);
    renderConservationCanvas(cons,seqs.length,container,r.sf);
  }).catch(function(err){
    container.innerHTML='<div style="color:#c00;font-size:10px">Error loading alignment: '+err.message+'</div>';
  });
}

function renderConservationCanvas(cons,nSeqs,container,sf){
  if(!cons.length){container.innerHTML='<div style="color:#999">No data</div>';return;}
  var html='<div class="conservation-container">';
  html+='<div style="font-weight:600;font-size:10px;margin-bottom:2px">Conservation Profile ('+nSeqs+' sequences, '+cons.length+' alignment columns)</div>';
  html+='<canvas id="consCanvas" class="conservation-canvas"></canvas>';
  html+='<div class="conservation-legend">';
  html+='<span style="color:#1a6b3c">&#9632; ≥90%</span>';
  html+='<span style="color:#4CAF50">&#9632; 70–90%</span>';
  html+='<span style="color:#FF9800">&#9632; 50–70%</span>';
  html+='<span style="color:#f44336">&#9632; &lt;50%</span>';
  html+='<span style="color:#ccc">&#9632; gap-heavy</span>';
  html+='</div>';
  html+='<div id="consTooltip" style="position:fixed;background:#333;color:#fff;padding:2px 6px;border-radius:3px;font-size:10px;pointer-events:none;display:none;z-index:200"></div>';
  html+='</div>';
  container.innerHTML=html;
  var canvas=document.getElementById('consCanvas');
  if(!canvas)return;
  var cw=container.offsetWidth-20;
  canvas.style.width=cw+'px'; canvas.style.height='80px';
  var dpr=window.devicePixelRatio||1;
  canvas.width=cw*dpr; canvas.height=80*dpr;
  var ctx=canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  var barW=cw/cons.length;
  var plotH=65;
  // Annotation bar if present
  if(sf&&sf.annotations&&sf.annotations.length){
    var annH=8;
    ctx.fillStyle='#eee'; ctx.fillRect(0,plotH+2,cw,annH);
    sf.annotations.forEach(function(ann){
      var x1=(ann.start/cons.length)*cw;
      var x2=((ann.end+1)/cons.length)*cw;
      ctx.fillStyle=ann.color||'#999';
      ctx.fillRect(x1,plotH+2,x2-x1,annH);
    });
  }
  // Conservation bars
  for(var i=0;i<cons.length;i++){
    var d=cons[i];
    var bh=d.cons*plotH;
    var x=i*barW;
    var col;
    if(d.gapFrac>0.5) col='#ccc';
    else if(d.cons>=0.9) col='#1a6b3c';
    else if(d.cons>=0.7) col='#4CAF50';
    else if(d.cons>=0.5) col='#FF9800';
    else col='#f44336';
    ctx.fillStyle=col;
    ctx.fillRect(x,plotH-bh,Math.max(barW-0.3,0.5),bh);
  }
  // Position labels
  ctx.fillStyle='#999'; ctx.font='9px sans-serif'; ctx.textAlign='center';
  var step=Math.max(1,Math.floor(cons.length/8));
  for(var p=0;p<cons.length;p+=step){
    ctx.fillText(String(p+1),p*barW+barW/2,plotH+20);
  }
  // Tooltip on hover
  canvas.addEventListener('mousemove',function(e){
    var rect=canvas.getBoundingClientRect();
    var mx=(e.clientX-rect.left)/rect.width*cons.length;
    var idx=Math.floor(mx);
    var tip=document.getElementById('consTooltip');
    if(idx>=0&&idx<cons.length&&tip){
      var d2=cons[idx];
      tip.textContent='Pos '+(idx+1)+': '+(d2.cons*100).toFixed(1)+'% ('+d2.dom+') '+d2.nonGap+'/'+d2.total+' non-gap';
      tip.style.left=e.clientX+12+'px'; tip.style.top=e.clientY-24+'px'; tip.style.display='block';
    }
  });
  canvas.addEventListener('mouseleave',function(){
    var tip=document.getElementById('consTooltip');
    if(tip)tip.style.display='none';
  });
}

  var body='<div class="annotation-editor">';
  body+='<div style="margin-bottom:6px"><span style="font-weight:600;font-size:10px">1. Select region type:</span></div>';
  body+='<div class="annotation-types" id="annTypes">';
  REGION_TYPES.forEach(function(rt){
    body+='<div class="annotation-type-btn'+(rt.id===activeType?' active':'')+'" style="background:'+rt.color+';color:#fff" data-type="'+rt.id+'">'+rt.label+'</div>';
  });
  body+='</div>';
  body+='<div style="font-weight:600;font-size:10px;margin:4px 0">2. Click + drag on sequence to annotate ('+seq.length+' nt):</div>';
  body+='<div id="annSelInfo" style="font-size:10px;color:#666;height:16px;margin-bottom:2px"></div>';
  body+='<div class="annotation-seq-wrap" id="annSeqWrap"></div>';
  body+='<div id="annListDiv" style="margin-top:8px"></div>';
  body+='<div style="margin-top:8px"><div style="font-weight:600;font-size:10px;margin-bottom:4px">Structure diagram:</div><div id="annCartoon"></div></div>';
  body+='</div>';

  var overlay=document.createElement('div');
  overlay.className='modal-overlay';
  overlay.innerHTML='<div class="modal" style="max-width:900px">'+
    '<div class="modal-title"><span>Annotate: '+esc(sfName)+' ('+seq.length+' nt)</span><button onclick="this.closest(\'.modal-overlay\').remove()">&times;</button></div>'+
    '<div class="modal-body">'+body+'</div>'+
    '<div class="modal-footer">'+
      '<button onclick="this.closest(\'.modal-overlay\').remove()">Cancel</button>'+
      '<button class="primary" id="annSaveBtn">Save Annotations</button>'+
    '</div></div>';
  document.body.appendChild(overlay);

  var seqWrap=document.getElementById('annSeqWrap');
  var selInfo=document.getElementById('annSelInfo');
  var listDiv=document.getElementById('annListDiv');
  var cartoonDiv=document.getElementById('annCartoon');

  function renderSeqRows(){
    var html='';
    for(var r=0;r<seq.length;r+=ROW_LEN){
      html+='<div class="annotation-seq-row">';
      html+='<span class="ann-pos">'+(r+1)+'</span>';
      var end=Math.min(r+ROW_LEN,seq.length);
      for(var i=r;i<end;i++){
        var bg=getAnnColorAt(anns,i);
        var style=bg?'background:'+bg+';color:#fff;':'';
        html+='<span class="ann-char" data-pos="'+i+'" style="'+style+'">'+seq[i]+'</span>';
      }
      html+='</div>';
    }
    seqWrap.innerHTML=html;
  }

  function renderList(){
    if(!anns.length){
      listDiv.innerHTML='<div style="color:#999;font-size:10px">No annotations yet. Select a type, then click+drag on the sequence.</div>';
    } else {
      anns.sort(function(a,b){return a.start-b.start;});
      var h='<table style="font-size:10px;width:auto"><tr><th>Type</th><th>Range</th><th>Length</th><th></th></tr>';
      anns.forEach(function(ann,idx){
        var rt=REGION_TYPES.find(function(r2){return r2.id===ann.type;})||{label:ann.type,color:'#999'};
        h+='<tr><td><span style="background:'+(ann.color||rt.color)+';color:#fff;padding:1px 6px;border-radius:2px;font-size:9px;font-weight:600">'+esc(rt.label)+'</span></td>';
        h+='<td class="mono">'+(ann.start+1)+' &ndash; '+(ann.end+1)+'</td>';
        h+='<td class="num">'+(ann.end-ann.start+1)+' nt</td>';
        h+='<td><button data-delidx="'+idx+'" style="font-size:9px;padding:0 6px;background:#fee;border-color:#c00;color:#c00;cursor:pointer">&times;</button></td></tr>';
      });
      h+='</table>';
      listDiv.innerHTML=h;
      listDiv.querySelectorAll('button[data-delidx]').forEach(function(btn){
        btn.addEventListener('click',function(){anns.splice(parseInt(this.dataset.delidx),1);renderAll();});
      });
    }
  }

  function renderCartoon(){renderCartoonDiagram(anns,seq.length,sfName,cartoonDiv);}
  function renderAll(){renderSeqRows();renderList();renderCartoon();selInfo.textContent='';}

  // Type button handlers
  document.getElementById('annTypes').addEventListener('click',function(e){
    var btn=e.target.closest('.annotation-type-btn');
    if(!btn)return;
    activeType=btn.dataset.type;
    overlay.querySelectorAll('.annotation-type-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
  });

  // Sequence drag selection
  seqWrap.addEventListener('mousedown',function(e){
    var ch=e.target.closest('.ann-char');
    if(!ch)return;
    dragStart=parseInt(ch.dataset.pos); dragEnd=dragStart;
    e.preventDefault();
    var rt=REGION_TYPES.find(function(r2){return r2.id===activeType;});
    ch.classList.add('drag-sel');
    ch.style.background=rt?rt.color:'#999';
    ch.style.color='#fff';
    selInfo.textContent='Position: '+(dragStart+1);

    function onMove(ev){
      var el=document.elementFromPoint(ev.clientX,ev.clientY);
      if(!el||!el.classList||!el.classList.contains('ann-char'))return;
      var newEnd=parseInt(el.dataset.pos);
      if(newEnd===dragEnd)return;
      dragEnd=newEnd;
      // Clear old highlights
      seqWrap.querySelectorAll('.drag-sel').forEach(function(c2){
        c2.classList.remove('drag-sel');
        var p2=parseInt(c2.dataset.pos);
        var bg2=getAnnColorAt(anns,p2);
        c2.style.background=bg2||''; c2.style.color=bg2?'#fff':'';
      });
      // Apply new highlights
      var s=Math.min(dragStart,dragEnd),en=Math.max(dragStart,dragEnd);
      seqWrap.querySelectorAll('.ann-char').forEach(function(c2){
        var p2=parseInt(c2.dataset.pos);
        if(p2>=s&&p2<=en){c2.classList.add('drag-sel');c2.style.background=rt?rt.color:'#999';c2.style.color='#fff';}
      });
      selInfo.textContent='Selecting: '+(s+1)+' \u2013 '+(en+1)+' ('+(en-s+1)+' nt) \u2192 '+(rt?rt.label:activeType);
    }
    function onUp(){
      document.removeEventListener('mousemove',onMove);
      document.removeEventListener('mouseup',onUp);
      if(dragStart>=0&&dragEnd>=0){
        var s=Math.min(dragStart,dragEnd),en=Math.max(dragStart,dragEnd);
        var rt2=REGION_TYPES.find(function(r2){return r2.id===activeType;});
        anns.push({type:activeType,label:rt2?rt2.label:activeType,start:s,end:en,color:rt2?rt2.color:'#999'});
        dragStart=-1; dragEnd=-1;
        renderAll();
      }
    }
    document.addEventListener('mousemove',onMove);
    document.addEventListener('mouseup',onUp);
  });

  // Save annotations
  overlay.querySelector('#annSaveBtn').addEventListener('click',function(){
    sf.annotations=anns; sf.last_modified=today();
    save(); renderTab(); overlay.remove();
  });
  overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});

  renderAll();
}

// ===================== CARTOON DIAGRAM =====================

function renderCartoonDiagram(anns,seqLen,sfName,container){
  if(!anns||!anns.length){container.innerHTML='<div style="color:#999;font-size:10px">Add annotations to see structure diagram</div>';return;}
  var W=660,H=90;
  var barY=25,barH=28,margin=35;
  var drawW=W-2*margin;
  var sc=drawW/seqLen;
  var svg='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+W+' '+H+'" style="width:100%;max-width:'+W+'px;height:auto;background:#fff;border:1px solid #eee">';
  svg+='<text x="'+(W/2)+'" y="14" text-anchor="middle" font-size="10" font-weight="600" fill="#333">'+esc(sfName)+' ('+seqLen+' nt)</text>';
  // Background bar
  svg+='<rect x="'+margin+'" y="'+barY+'" width="'+drawW+'" height="'+barH+'" fill="#e0e0e0" rx="4"/>';
  // Annotation segments
  var sorted=anns.slice().sort(function(a,b){return a.start-b.start;});
  sorted.forEach(function(ann){
    var x=margin+ann.start*sc;
    var w=(ann.end-ann.start+1)*sc;
    svg+='<rect x="'+x+'" y="'+barY+'" width="'+Math.max(w,2)+'" height="'+barH+'" fill="'+(ann.color||'#999')+'" rx="2" opacity="0.9"/>';
    if(w>20){
      svg+='<text x="'+(x+w/2)+'" y="'+(barY+barH/2+3.5)+'" text-anchor="middle" font-size="8" fill="#fff" font-weight="700">'+esc(ann.label||ann.type)+'</text>';
    }
  });
  // 5' / 3' labels
  svg+='<text x="'+(margin-4)+'" y="'+(barY+barH/2+4)+'" text-anchor="end" font-size="10" fill="#333" font-weight="700">5\'</text>';
  svg+='<text x="'+(margin+drawW+4)+'" y="'+(barY+barH/2+4)+'" text-anchor="start" font-size="10" fill="#333" font-weight="700">3\'</text>';
  // Scale ticks
  var tStep=seqLen<=200?50:seqLen<=500?100:200;
  for(var t=0;t<=seqLen;t+=tStep){
    var tx=margin+t*sc;
    svg+='<line x1="'+tx+'" y1="'+(barY+barH)+'" x2="'+tx+'" y2="'+(barY+barH+5)+'" stroke="#999" stroke-width="0.8"/>';
    svg+='<text x="'+tx+'" y="'+(barY+barH+14)+'" text-anchor="middle" font-size="7" fill="#666">'+t+'</text>';
  }
  var ex=margin+seqLen*sc;
  svg+='<line x1="'+ex+'" y1="'+(barY+barH)+'" x2="'+ex+'" y2="'+(barY+barH+5)+'" stroke="#999" stroke-width="0.8"/>';
  svg+='<text x="'+ex+'" y="'+(barY+barH+14)+'" text-anchor="middle" font-size="7" fill="#666">'+seqLen+'</text>';
  svg+='</svg>';
  // Legend
  svg+='<div class="cartoon-legend">';
  var used={};
  sorted.forEach(function(ann){
    if(used[ann.type])return; used[ann.type]=true;
    var rt=REGION_TYPES.find(function(r2){return r2.id===ann.type;})||{label:ann.type};
    svg+='<span><span style="display:inline-block;width:10px;height:10px;background:'+(ann.color||'#999')+';border-radius:2px;vertical-align:middle"></span> '+esc(rt.label)+'</span>';
  });
  svg+='</div>';
  container.innerHTML=svg;
}

// ===================== START =====================
loadData();
